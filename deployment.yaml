apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-analyzer-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doc-analyzer
  template:
    metadata:
      labels:
        app: doc-analyzer
    spec:
      containers:
        - name: doc-analyzer
          image: doc-analyzer-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10